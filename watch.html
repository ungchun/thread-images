<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>남의 계정 지표</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252a34;--dim:#8b93a1;--fg:#e8eaed;--hot:#4ade80}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
h3{font-size:13px;font-weight:600;margin:24px 0 10px;color:var(--dim)}
.dim{color:var(--dim);font-size:12px}
main{padding:16px 24px}
.sum{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.sum b{color:var(--fg);font-weight:600;font-size:20px;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.c:hover{border-color:#3a4150}
.c.on{border-color:var(--hot)}
.c.off{opacity:.45}
.c .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .n a{color:var(--fg);text-decoration:none}
.c .n a:hover{color:var(--hot)}
.c .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.c .s{font-size:11px;color:var(--dim)}
.c .cut{color:#d4a24c}
.app{color:#9ec5ff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0 10px}
.tools .sp{flex:1}
.tools button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:7px;
 padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
label{font-size:12px;color:var(--dim)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:8px 10px;
 border-bottom:1px solid var(--line);white-space:nowrap}
th[data-k]{cursor:pointer}
th[data-k]:hover,th.on{color:var(--hot)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#1c2028}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank{color:var(--dim);font-size:12px;width:26px;text-align:right}
.acct{white-space:nowrap;font-weight:500}
.acct a{color:var(--fg);text-decoration:none}
.acct a:hover{color:var(--hot)}
.bar{position:relative;min-width:70px}
.bar i{position:absolute;right:0;top:6px;bottom:6px;background:#1e3a2a;border-radius:3px}
.bar b{position:relative;font-weight:600}
.txt{font-size:13px;line-height:1.5;max-width:560px}
.txt a{color:var(--fg);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.txt a:hover{color:var(--hot)}
.pg{display:flex;gap:4px;margin-right:4px}
.pg a{font-size:16px;font-weight:600;color:var(--dim);text-decoration:none;padding:2px 10px;border-radius:7px}
.pg a:hover{color:var(--fg)}
.pg a.on{color:var(--fg);background:var(--line)}
</style></head><body>
<header><div class="pg"><a href="dashboard.html">우리 계정</a><a href="watch.html" class="on">경쟁 계정</a></div><span class="dim" id="stamp"></span></header>
<main>
  <div class="sum" id="sum"></div>
  <h3>최근 1주일 많이 터진 글 TOP 10 (셀프 답글 제외)</h3>
  <div id="top"></div>
  <h3>계정별 10/1 이후 글 · 최고 좋아요 순 · 누르면 그 계정 글만 보기 · 앱 이름 뒤 ?는 이미지로 추정</h3>
  <div class="cards" id="cards"></div>
  <div class="tools">
    <b id="title">전체 글</b><button id="all" hidden>전체 보기</button>
    <span class="sp"></span>
    <label><input type="checkbox" id="hideReply" checked> 셀프 답글 숨기기</label>
  </div>
  <div id="list"></div>
</main>
<script>
const COLS = [["likes","좋아요"],["replies","답글"],["reposts","리포스트"],["quotes","인용"]];
let data, sortKey = "likes", pick = "";
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when = u => new Date(u).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
const sum = (xs, k) => xs.reduce((s, p) => s + p[k], 0);
const postsOf = a => a.posts.filter(p => !($("hideReply").checked && p.reply));

function render() {
  const accs = data.accounts.map(a => {
    const ps = postsOf(a);
    return {a, ps, max: Math.max(0, ...ps.map(p => p.likes))};
  }).sort((x, y) => y.max - x.max);
  const all = accs.flatMap(r => r.ps.map(p => ({...p, a: r.a})));

  $("sum").innerHTML = `<span><b>${accs.length}</b>계정</span><span><b>${fmt(all.length)}</b>글 (${new Date(data.since).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})}부터)</span>
    <span><b>${fmt(sum(all, "likes"))}</b>좋아요</span><span><b>${fmt(sum(all, "reposts"))}</b>리포스트</span>`;

  $("cards").innerHTML = accs.map(r => `<div class="c ${pick === r.a.username ? "on" : ""} ${r.ps.length ? "" : "off"}" data-u="${esc(r.a.username)}">
    <div class="n"><a href="${r.a.link}" target="_blank">@${esc(r.a.username)}</a></div>
    <div class="s">${esc(r.a.country || "")} · <span class="app">${esc(r.a.app || "?")}</span></div>
    <div class="s">${r.ps.length ? `글 ${r.ps.length} · 최고 ${fmt(r.max)}` : r.a.error ? "수집 실패" : "기간 내 글 없음"}${r.a.followers != null ? ` · 팔로워 ${fmt(r.a.followers)}` : ""}</div>
    ${r.a.cut ? `<div class="s cut">${when(r.a.posts.at(-1).utc).split(" 오")[0]}부터만 잡힘</div>` : ""}
  </div>`).join("");

  const week = Date.parse(data.generated) - 7 * 864e5;
  $("top").innerHTML = table(data.accounts.flatMap(a => a.posts.filter(p => !p.reply && Date.parse(p.utc) >= week).map(p => ({...p, a})))
    .sort((x, y) => y.likes - x.likes).slice(0, 10));

  const rows = all.filter(p => !pick || p.a.username === pick)
    .sort((x, y) => sortKey === "utc" ? y.utc.localeCompare(x.utc) : y[sortKey] - x[sortKey]);
  $("title").textContent = pick ? `@${pick} 글 ${rows.length}개` : `전체 글 ${rows.length}개`;
  $("all").hidden = !pick;
  $("list").innerHTML = table(rows, true);
}

function table(rows, sortable) {
  const max = Math.max(1, ...rows.map(p => p.likes));
  const th = (k, t, c = "") => sortable ? `<th data-k="${k}" class="${c} ${sortKey === k ? "on" : ""}">${t}${sortKey === k && k !== "utc" ? " ↓" : ""}</th>` : `<th class="${c}">${t}</th>`;
  return `<table><tr><th></th>${th("utc", "날짜")}<th>계정</th>` +
    COLS.map(([k, t]) => th(k, t, "num")).join("") +
    `<th>본문</th></tr>` + rows.map((p, i) => `<tr>
      <td class="rank">${i + 1}</td><td class="dim">${when(p.utc)}</td>
      <td class="acct"><a href="${p.a.link}" target="_blank">@${esc(p.a.username)}</a><div class="dim">${esc(p.a.country || "")} · <span class="app">${esc(p.a.app || "?")}</span></div></td>
      <td class="num bar"><i style="width:${Math.max(2, Math.round(p.likes / max * 100))}%"></i><b>${fmt(p.likes)}</b></td>
      <td class="num">${fmt(p.replies)}</td><td class="num">${fmt(p.reposts)}</td><td class="num">${fmt(p.quotes)}</td>
      <td class="txt"><a href="${p.link}" target="_blank" title="${esc(p.text)}">${esc(p.text) || "(본문 없음)"}</a></td></tr>`).join("") + `</table>`;
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const k = e.target.closest("th")?.dataset.k;
  if (k) { sortKey = k; return render(); }
  const c = e.target.closest(".c");
  if (c) { pick = pick === c.dataset.u ? "" : c.dataset.u; render(); }
});
$("all").onclick = () => { pick = ""; render(); };
$("hideReply").onchange = render;

fetch("watch.json").then(r => r.json()).then(d => {
  data = d;
  $("stamp").textContent = "수집 " + new Date(d.generated).toLocaleString("ko-KR");
  render();
});
</script></body></html>
