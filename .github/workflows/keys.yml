name: keys
on:
  workflow_dispatch:
jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
        run: |
          python3 -c "
          import json,os,urllib.request,urllib.parse
          d=json.loads(os.environ['THREADS_ACCOUNTS'])
          for k in ['inkling01','ashgrey._02']:
              v=d[k]
              u='https://graph.threads.net/v1.0/'+v['user_id']+'/threads?'+urllib.parse.urlencode({'fields':'text,timestamp','limit':3,'access_token':v['token']})
              try:
                  r=json.load(urllib.request.urlopen(u))
                  print('==',k)
                  for p in r.get('data',[]):
                      print('   ',(p.get('text') or '')[:50].replace(chr(10),' / '))
              except Exception as e: print('==',k,'실패',e)
          "
