name: check

on:
  workflow_dispatch:
    inputs:
      args:
        description: '추가 인자 (예: --posted 2026-09-05)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tokens
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
        run: python3 check.py ${{ inputs.args }}
