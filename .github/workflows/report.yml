name: report

on:
  # 매일 10:07 KST(01:07 UTC). 발행과 달리 GitHub schedule을 쓴다 — 브리핑은 늦거나 하루 빠져도
  # 사고가 아니다. 00:17 UTC 수집 뒤에 돌도록 잡았다. 수집이 낡았으면 brief.py가 맨 위에 경고한다.
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2026-10-22부터 매일 브리핑은 brief.py다 — 계정 상태·승인할 제안·규칙 위반·OKR 진척.
      # API를 부르지 않고 dashboard.yml(6시간마다)이 커밋한 dashboard*.json만 읽는다. 예전 report.py는 수동으로만 쓴다.
      - name: Send brief
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 brief.py
