name: threads

on:
  schedule:
    # 일본·대만은 현지 08:00, 유럽 4개국은 현지 20:00 (서머타임 기준).
    # 겨울엔 유럽만 한 시간 밀린다.
    - cron: "0 23 * * *"   # 일본
    - cron: "0 0 * * *"    # 대만
    - cron: "0 18 * * *"   # 프랑스·독일·스페인 (저녁 8시)
    - cron: "0 19 * * *"   # 포르투갈 (저녁 8시)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "posted"
          git push
