name: threads

on:
  # GitHub schedule cron은 2026-09-01 제거. 스케줄러가 회차를 통째로 흘리는 일이
  # 반복돼(8월 말·9월 초 두 차례) 깨우는 역할을 cron-job.org로 옮겼다.
  # cron-job.org가 30분마다 workflow_dispatch API를 호출한다 (threads-dispatch 잡).
  workflow_dispatch:

permissions:
  contents: write

# 앞 회차가 아직 도는 중에 cron-job.org가 다음 회차를 부르면, 두 실행이 같은
# schedule.txt를 각자 읽어 같은 행을 동시에 발행한다. done 표시는 자기 메모리
# 안에만 있어 상대를 못 막고, 푸시 재시도는 이미 발행이 끝난 뒤라 늦다.
# 영상 회차는 컨테이너 대기가 계정마다 붙어 10분을 넘기므로 실제로 겹칠 수 있다.
# cancel-in-progress: false — 도는 회차를 죽이면 발행 직후 schedule.txt 갱신이
# 날아가 오히려 중복이 난다. 새 호출을 대기시킨다.
concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      # 발행 기록(schedule.txt에서 줄 삭제)을 반드시 남긴다.
      # 푸시가 거부되면 그 줄이 살아남아 30분 뒤 회차가 같은 글을 다시 올린다.
      # 2026-09-10에 실제로 발생: 대시보드 커밋과 충돌 → 스페인·독일·이탈리아·프랑스 4건 중복 발행.
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "posted"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 거부됨, rebase 후 재시도 ($i/5)"
            git pull --rebase --autostash || exit 1
            sleep $((i * 3))
          done
          echo "::error::5회 시도 후에도 푸시 실패. schedule.txt가 갱신되지 않아 중복 발행 위험."
          exit 1
