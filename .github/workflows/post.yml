name: threads

on:
  schedule:
    # 대만·일본은 현지 아침, 유럽 4개국도 현지 아침 8시(한국 오후 3~4시).
    # 정각은 Actions가 가장 붐벼 지연·드롭이 잦으므로 5분씩 비켜 둔다.
    - cron: "35 1 * * *"   # 대만 (UTC 01:30 예약)
    - cron: "5 6 * * *"    # 프랑스 (UTC 06:00)
    - cron: "15 6 * * *"   # 독일 (UTC 06:10)
    - cron: "25 6 * * *"   # 스페인 (UTC 06:20)
    - cron: "5 7 * * *"    # 포르투갈 (UTC 07:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "posted"
          git push
