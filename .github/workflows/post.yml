name: threads

on:
  schedule:
    # 예약 시각마다 cron을 박으면 그 한 번을 GitHub이 지연·스킵할 때
    # 다음날까지 기회가 없다. 자주 돌면서 지난 예약을 주워가게 둔다.
    # 예약이 없는 회차는 몇 초 만에 끝난다.
    - cron: "13,43 * * * *"
    # 2026-08 말 GitHub 스케줄러 장애로 예약이 멈춘 적이 있다.
    # 다시 멈추면 이 파일에 커밋을 밀어 재동기화한다.
    # 2026-09-01 재발 - */30, */5 모두 회차 연속 누락. disable/enable 재등록도 무효.
    # 정각·5분 배수 슬롯은 전 세계가 몰려 드랍이 심하다는 GitHub 공식 안내에 따라
    # 어중간한 분(13,43)으로 변경. 30분 주기는 유지.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "posted"
          git push
