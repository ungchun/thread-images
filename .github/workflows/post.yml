name: threads

on:
  # GitHub schedule cron은 2026-09-01 제거. 스케줄러가 회차를 통째로 흘리는 일이
  # 반복돼(8월 말·9월 초 두 차례) 깨우는 역할을 cron-job.org로 옮겼다.
  # cron-job.org가 30분마다 workflow_dispatch API를 호출한다 (threads-dispatch 잡).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 run.py
        env:
          THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m "posted"
          git push
