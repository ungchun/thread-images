<!doctype html>
<meta charset="utf-8">
<title>대시보드</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252a34;--dim:#8b93a1;--fg:#e8eaed;--hot:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;
 align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:600}
.stamp{color:var(--dim);font-size:12px}
#refresh{background:var(--card);border:1px solid var(--line);color:var(--fg);
 border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
#refresh:hover:not(:disabled){border-color:var(--hot)}
#refresh:disabled{opacity:.5;cursor:default}
.proj{display:flex;gap:8px;padding:14px 24px 0}
.proj button{background:var(--line);border:0;color:var(--dim);padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.proj button.on{background:var(--hot);color:#fff}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--dim);padding:12px 16px;cursor:pointer;
 font-size:14px;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--hot)}
nav button b{background:var(--line);border-radius:9px;padding:1px 7px;margin-left:6px;font-size:12px}
main{padding:24px;max-width:1400px}
section{display:none}section.on{display:block}
.empty{color:var(--dim);padding:48px 0;text-align:center}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;
 padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:#1c2028}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.txt{white-space:pre-wrap;font-size:13px;line-height:1.5}
a{color:inherit}
.grid{overflow-x:auto;padding-bottom:8px}
.grid table{width:auto;border-collapse:separate;border-spacing:3px}
.grid th{padding:4px 6px;font-size:11px}
.grid td{padding:0;border:0}
.cell{width:34px;height:30px;border-radius:5px;background:#1b1f27;display:block;
 position:relative;cursor:pointer;border:1px solid transparent}
.cell:hover{border-color:var(--hot)}
.cell span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:10px;color:#0f1115;font-weight:600}
.tip{position:fixed;background:#000;border:1px solid var(--line);border-radius:8px;
 padding:10px 12px;font-size:12px;max-width:340px;pointer-events:none;z-index:9;
 display:none;white-space:pre-wrap;line-height:1.55}
.legend{color:var(--dim);font-size:11px;margin-top:12px}
.acct{font-weight:500;white-space:nowrap}
.bar{position:relative}
.bar i{position:absolute;left:0;top:3px;bottom:3px;background:#1e3a2a;border-radius:3px;z-index:0}
.bar b{position:relative;z-index:1;font-weight:500}
.big{font-size:15px;font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools select,.tools input{background:var(--card);color:var(--fg);border:1px solid var(--line);
 border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit}
.tools .sp{flex:1}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--fg)}
th.s.on{color:var(--hot)}
.rank{color:var(--dim);font-size:12px;width:26px;text-align:right}
.sub{color:var(--dim);font-size:11px}
tr.top td{background:#151d19}
.skip{opacity:.5}
.skip .txt{text-decoration:line-through;text-decoration-color:var(--line)}
.why{color:var(--dim);font-size:11px;font-style:italic}
.divider{border-top:1px solid var(--line);margin:28px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:16px 18px;margin-bottom:12px}
.card.next{border-color:#2f6b47}
.score{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.scorebar{height:6px;border-radius:3px;background:#1b1f27;margin:8px 0 2px;overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--hot)}
.copy{white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--fg);
 background:#12151b;border-radius:8px;padding:10px 12px;margin:8px 0}
.meta{color:var(--dim);font-size:12px}
.verdict{font-size:13px;margin-top:8px;color:#cbd3c9}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.vs{grid-template-columns:1fr}}
.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;
 padding:2px 10px;font-size:11px;color:var(--dim);margin-right:6px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:12px}
.ins h4{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:500}
.row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.row .k{width:38px;text-align:right;color:var(--dim);flex:none}
.row .b{flex:1;height:14px;background:#1b1f27;border-radius:3px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--hot);opacity:.85}
.row .v{width:74px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.row.thin{opacity:.35}
.row.thin .v::after{content:" ?";color:var(--dim)}
.note2{color:var(--dim);font-size:11px;margin-top:8px;line-height:1.5}
.acct-ins{font-size:12px;border-collapse:collapse;width:100%}
.acct-ins td,.acct-ins th{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tour{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:760px){.tour{grid-template-columns:1fr}}
.champ{border-color:#2f6b47}
.champ .copy{border-left:2px solid var(--hot)}
.q{padding:8px 0;border-bottom:1px solid var(--line)}
.q:last-child{border:0}
.q b{font-size:12px}
.q .copy{margin:6px 0 4px;font-size:12px}
.acct-ins th{color:var(--dim);font-weight:500;text-align:left}
.badge{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:500}
.badge.active{background:#12301f;color:#5fd08a}
.badge.paused{background:#2e2a14;color:#d6bd57}
.badge.dead{background:#2e1519;color:#e06c78}
tr.off td{opacity:.45}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--dim)}
.sum b{color:var(--fg);font-weight:600}
.dead{color:#c46;font-size:11px}
.accs{font-size:12px;color:var(--dim);line-height:1.8}
.pill{display:inline-block;background:var(--line);border-radius:6px;padding:1px 7px;
 font-size:11px;color:var(--dim);margin-left:6px}
.reply{border-left:2px solid var(--line);padding-left:12px;margin:2px 0 14px}
h3{font-size:13px;color:var(--dim);font-weight:500;margin:22px 0 8px}
.err{background:#2a1618;border:1px solid #4a2226;border-radius:8px;padding:10px 14px;
 margin-bottom:16px;font-size:13px}

/* 실험 탭 재구성: 결론을 위에, 세부는 접어둔다 */
.now{background:linear-gradient(135deg,#1b2a4a,#16203a);border:1px solid #2c4270;
  border-radius:12px;padding:16px 18px;margin-bottom:14px}
.now-h{font-size:12px;color:#8fb3ee;letter-spacing:.02em}
.now-q{font-size:17px;line-height:1.5;margin-top:8px}
.now-v{font-size:12px;color:var(--dim);margin-top:8px}
.concl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:820px){.concl{grid-template-columns:1fr}}
.card.cf{border-left:3px solid #3d7a4e}
.card.cw{border-left:3px solid #8a6d2f}
.ci{padding:9px 0;border-top:1px solid var(--line)}
.ci:first-of-type{border-top:0}
.ci b{font-size:13px}
.ci .meta{margin-top:3px;line-height:1.5;white-space:normal}
.warn{color:#e0a14b;font-size:11px;margin-top:5px;line-height:1.5}
.mini{display:flex;align-items:flex-end;gap:3px;height:34px;margin:7px 0 4px}
.mini span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.mini i{width:100%;background:#4a7ec4;border-radius:2px;display:block}
.mini u{font-size:9px;color:var(--dim);text-decoration:none;margin-top:2px}
table.rt{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.rt th{font-size:11px;color:var(--dim);font-weight:500;text-align:left;padding:0 8px 6px}
table.rt td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.rtx{max-width:230px;color:var(--dim);font-size:12px}
table.rt .bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;width:64px;margin-left:auto}
table.rt .bar i{display:block;height:100%;background:#4a7ec4;border-radius:2px}
tr.vr td{color:#e0a14b;font-size:11px;line-height:1.5;white-space:normal;padding-top:0;border-top:0}
details.fold{margin-top:12px}
details.fold>summary{cursor:pointer;color:var(--dim);font-size:12px;padding:9px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;user-select:none}
details.fold[open]>summary{border-radius:8px 8px 0 0;color:var(--fg)}
details.fold>summary:hover{color:var(--fg)}
</style>

<header>
  <h1>대시보드</h1>
  <span class="stamp" id="stamp"></span>
  <button id="refresh">갱신</button>
  <span class="stamp" id="rmsg"></span>
</header>
<div class="proj" id="proj"></div>
<nav>
  <button data-t="sched" class="on">예약<b id="n-sched">0</b></button>
  <button data-t="posts">스레드<b id="n-posts">0</b></button>
  <button data-t="ig">인스타<b id="n-ig">0</b></button>
  <button data-t="pending">미답변<b id="n-pending">0</b></button>
  <button data-t="insight">실험<b id="n-insight">0</b></button>
</nav>
<main>
  <div id="errors"></div>
  <section id="sched" class="on"></section>
  <section id="posts"></section>
  <section id="ig"></section>
  <section id="pending"></section>
  <section id="insight"></section>
</main>
<div class="tip" id="tip"></div>

<script>
const $ = s => document.querySelector(s);
// 값이 배열·숫자로 들어오는 필드가 있어(rounds.json은 손으로 쓴다) 문자열로 먼저 눕힌다.
const esc = s => (s == null ? "" : Array.isArray(s) ? s.join(", ") : String(s))
  .replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const n = v => (v||0).toLocaleString();

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.t).classList.add("on");
});

function renderSched(rows){
  if(!rows.length) return `<div class="empty">예약된 글이 없다</div>`;
  return `<table><thead><tr>
    <th>현지 시각</th><th>계정</th><th>본문</th><th>미디어</th><th>UTC</th>
  </tr></thead><tbody>` + rows.map(r => `<tr>
    <td class="acct">${r.flag} ${esc(r.local)}</td>
    <td>${esc(r.account)}</td>
    <td class="txt">${esc(r.text)}</td>
    <td class="dim">스레드 ${r.media.length}개<br><span style="font-size:11px">${esc(r.media.join(", "))}</span>
      <br>${(r.ig||[]).length ? `인스타 ${r.ig.length}개<br><span style="font-size:11px">${esc(r.ig.join(", "))}</span>` : `<span style="font-size:11px">인스타 없음</span>`}</td>
    <td class="dim">${esc(r.utc.slice(0,16).replace("T"," "))}</td>
  </tr>`).join("") + `</tbody></table>`;
}

const mkState = (id, cols, third) => ({rows: [], sort: "views", desc: true, acct: "", id, cols, third});
let P = mkState("p", [["views","조회"],["likes","하트"],["replies","댓글"],["reposts","리포스트"],["shares","공유"]], "reposts");
let G = mkState("g", [["views","조회"],["likes","하트"],["replies","댓글"],["saved","저장"],["shares","공유"]], "saved");

function heatOf(v, max){
  if(!v) return "#1b1f27";
  const t = Math.log10(v + 1) / Math.log10(max + 1);
  return `hsl(${140 - t * 30} ${45 + t * 40}% ${18 + t * 42}%)`;
}

function renderPosts(S, rows){
  S.rows = rows;
  if(!rows.length) return `<div class="empty">게시물이 없다</div>`;
  const accs = [...new Set(rows.map(r => r.account))].sort();
  return `<div class="tools">
    <select id="${S.id}-acct"><option value="">전체 계정</option>` +
      accs.map(a => {
        const f = rows.find(r => r.account === a);
        return `<option value="${a}">${f.flag} ${a}</option>`;
      }).join("") + `</select>
    <span class="sp"></span>
    <span class="dim" id="${S.id}-count"></span>
  </div><div id="${S.id}-body"></div>`;
}

function paintPosts(S){
  const box = $("#" + S.id + "-body"); if(!box) return;
  let rows = S.rows.filter(r => !S.acct || r.account === S.acct);
  $("#" + S.id + "-count").textContent = rows.length + "건";
  box.innerHTML = postsGrid(S, rows) + `<h3>전체 목록</h3>` + postsList(S, rows);
  wireSort(S);
}

function postsList(S, rows){
  const k = S.sort;
  rows = [...rows].sort((a,b) => {
    const d = k === "date" ? (a.utc < b.utc ? -1 : 1) : (a[k]||0) - (b[k]||0);
    return S.desc ? -d : d;
  });
  const max = Math.max(...rows.map(r => r.views||0), 1);
  const cols = S.cols;
  const head = `<th class="rank"></th><th class="s ${k==="date"?"on":""}" data-k="date">날짜</th>
    <th>계정</th>` + cols.map(([c,l]) =>
      `<th class="s num ${k===c?"on":""}" data-k="${c}">${l}${k===c?(S.desc?" ↓":" ↑"):""}</th>`).join("") +
    `<th>본문</th>`;
  return `<table><thead><tr>${head}</tr></thead><tbody>` + rows.map((r,i) => {
    const w = Math.max(2, Math.round((r.views||0) / max * 100));
    return `<tr class="${i<3&&k==="views"&&S.desc?"top":""}">
      <td class="rank">${i+1}</td>
      <td class="dim">${esc(r.local)}<div class="sub">${esc(r.date)}</div></td>
      <td class="acct">${r.flag} ${esc(r.account)}</td>
      <td class="num bar"><i style="width:${w}%"></i><b class="${r.views>10000?"big":""}">${n(r.views)}</b></td>
      <td class="num">${n(r.likes)}</td><td class="num">${n(r.replies)}</td>
      <td class="num">${n(r[S.third])}</td><td class="num">${n(r.shares)}</td>
      <td class="txt"><a href="${r.link}" target="_blank">${esc(r.text)}</a></td>
    </tr>`;
  }).join("") + `</tbody></table>`;
}

function postsGrid(S, rows){
  const dates = [...new Set(rows.map(r => r.date))].sort();
  const accs = [...new Set(rows.map(r => r.account))].sort();
  const by = {}; rows.forEach(r => by[r.account + "|" + r.date] = r);
  const max = Math.max(...rows.map(r => r.views||0), 1);
  // 계정은 그 기간 총조회 순으로 — 잘 되는 나라가 위로 온다
  const tot = {}; rows.forEach(r => tot[r.account] = (tot[r.account]||0) + (r.views||0));
  accs.sort((a,b) => tot[b] - tot[a]);
  let g = `<div class="grid"><table><thead><tr><th></th>` +
    dates.map(d => `<th>${d.slice(5)}</th>`).join("") + `<th style="padding-left:12px">합계</th></tr></thead><tbody>`;
  accs.forEach(a => {
    const f = rows.find(r => r.account === a);
    g += `<tr><th style="text-align:right">${f.flag} ${esc(a)}</th>` + dates.map(d => {
      const r = by[a + "|" + d];
      if(!r) return `<td><i class="cell"></i></td>`;
      const tip = `${r.flag} ${r.account}  ${r.local}\n조회 ${n(r.views)} · 하트 ${n(r.likes)} · 댓글 ${n(r.replies)}\n${S.cols[3][1]} ${n(r[S.third])} · 공유 ${n(r.shares)}\n\n${r.text}`;
      return `<td><a class="cell" style="background:${heatOf(r.views,max)}" href="${r.link}"
        target="_blank" data-tip="${esc(tip)}"><span>${r.views>999?Math.round(r.views/1000)+"k":(r.views||"")}</span></a></td>`;
    }).join("") + `<td class="num dim" style="padding-left:12px">${n(tot[a])}</td></tr>`;
  });
  g += `</tbody></table></div><div class="legend">칸 = 게시물 하나. 색이 진할수록 조회수 높음. 계정은 총조회 순. 마우스를 올리면 지표, 누르면 원글로 이동.</div>`;
  return g;
}

function wireSort(S){
  document.querySelectorAll("#" + S.id + "-body th.s").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if(S.sort === k) S.desc = !S.desc; else { S.sort = k; S.desc = true; }
    paintPosts(S);
  });
}

function renderPending(rows, skipped){
  let out = "";
  if(!rows.length) out = `<div class="empty">미답변 답글이 없다</div>`;
  else {
    const by = {};
    rows.forEach(r => (by[r.account] = by[r.account] || []).push(r));
    out = Object.entries(by).sort((a,b) => b[1].length - a[1].length).map(([acc, list]) => `
      <h3>${list[0].flag} ${esc(acc)} — ${list.length}건</h3>` +
      list.map(r => `<div class="reply">
        <div class="dim" style="font-size:12px">${esc(r.when)} · @${esc(r.user)} ·
          <a href="${r.post_link}" target="_blank">${esc(r.post_text)}</a></div>
        <div class="txt">${esc(r.text)}</div>
      </div>`).join("")).join("");
  }
  if(skipped && skipped.length){
    out += `<div class="divider"></div>
      <h3>답하지 않기로 한 것 — ${skipped.length}건</h3>` +
      skipped.map(r => `<div class="reply skip">
        <div class="dim" style="font-size:12px">${r.flag} ${esc(r.when)} · @${esc(r.user)}</div>
        <div class="txt">${esc(r.text)}</div>
        <div class="why">${esc(r.why || "")}</div>
      </div>`).join("");
  }
  return out;
}

function bars(obj, label, minN){
  const ks = Object.keys(obj);
  if(!ks.length) return "";
  const max = Math.max(...ks.map(k => obj[k].score), 0.01);
  return ks.map(k => {
    const o = obj[k], thin = o.n < (minN || 3);
    return `<div class="row ${thin?"thin":""}">
      <span class="k">${esc(label(k))}</span>
      <span class="b"><i style="width:${Math.min(100, o.score/max*100)}%"></i></span>
      <span class="v">${o.score.toFixed(2)}<span class="meta"> n${o.n}</span></span>
    </div>`;
  }).join("");
}

function renderIns(ins){
  if(!ins || !ins.hour) return "";
  const acc = ins.accounts || {};
  const dead = Object.entries(acc).filter(([a,o]) => o.posts >= 4 && o.avg < 100);
  const LABEL = {active:"운영", paused:"중단", dead:"도달 없음"};
  const cnt = {active:0, paused:0, dead:0};
  Object.values(acc).forEach(o => cnt[o.state || "active"]++);
  const ordered = Object.entries(acc).sort((x,y) => {
    const w = s => s === "active" ? 0 : s === "paused" ? 1 : 2;
    return w(x[1].state) - w(y[1].state) || y[1].avg - x[1].avg;
  });
  return `<div class="ins">
    <div class="card"><h4>시간대 (현지)</h4>${bars(ins.hour, k => k+"시")}
      <div class="note2">흐린 줄은 표본 3건 미만이라 근거가 약하다.</div></div>
    <div class="card"><h4>요일</h4>${bars(ins.wday, k => k)}
      <div class="note2">일요일이 눈에 띄게 낮다.</div></div>
  </div>
  <div class="card"><h4>계정 상태</h4>
    <div class="sum">
      <span><b>${cnt.active}</b>개 운영</span>
      ${cnt.paused ? `<span><b>${cnt.paused}</b>개 중단</span>` : ""}
      ${cnt.dead ? `<span><b>${cnt.dead}</b>개 도달 없음</span>` : ""}
    </div>
    <table class="acct-ins"><tr><th>계정</th><th>상태</th><th>글</th>
      <th style="text-align:right">평균</th><th style="text-align:right">최고</th>
      <th>잘 된 시각</th><th>메모</th></tr>` +
    ordered.map(([a,o]) => {
      const st = o.state || "active";
      return `<tr class="${st!=="active"?"off":""}">
      <td>${esc(a)}</td>
      <td><span class="badge ${st}">${LABEL[st]||st}</span></td>
      <td class="meta">${o.posts}</td>
      <td style="text-align:right">${n(o.avg)}</td>
      <td style="text-align:right" class="meta">${n(o.max)}</td>
      <td class="meta">${o.best_hour!=null ? o.best_hour+"시"+(o.best_n<2?" (1건)":"") : "–"}</td>
      <td class="meta" style="white-space:normal">${esc(o.note||"")}</td>
    </tr>`;}).join("") + `</table>
    <div class="note2">상태는 accounts/status.json이 단일 출처다.
      배수·평균은 그 계정 평소 대비라 계정 규모가 100배씩 차이나도 비교가 된다.</div></div>`;
}

function renderTour(t){
  if(!t || !t.champion) return "";
  const c = t.champion;
  return `<div class="tour">
    <div class="card champ"><h4>현재 챔피언</h4>
      <div><b>${esc(c.key)}</b> <span class="score" style="font-size:18px">${c.score}</span></div>
      <div class="copy">${esc(c.kr)}</div>
      <div class="meta">${esc(c.note||"")}</div>
      ${(t.retired||[]).length ? `<div class="note2">탈락: ` +
        t.retired.map(r => `${esc(r.key)} (${r.score})`).join(", ") + `</div>` : ""}
    </div>
    <div class="card"><h4>도전 대기열 ${(t.queue||[]).length}개</h4>` +
      (t.queue||[]).map((q,i) => `<div class="q">
        <b>${i+1}. ${esc(q.key)}</b>
        <div class="copy">${esc(q.kr)}</div>
        <div class="meta">${esc(q.why||"")}</div>
      </div>`).join("") + `</div>
  </div>` + (t.rule ? `<div class="note2" style="margin-bottom:16px">${esc(t.rule)}</div>` : "");
}

// 설계·판정 필드는 라운드마다 dict일 수도 문자열일 수도 있다. 문자열을 Object.entries로
// 돌리면 글자 하나가 한 행이 되어 표가 폭발한다. 둘 다 받아 안전하게 그린다.
function kv(o, mt){
  if(!o) return "";
  if(typeof o === "string") return `<div class="meta" style="white-space:normal;margin-top:${mt||8}px">${esc(o)}</div>`;
  const ks = Object.keys(o);
  if(!ks.length) return "";
  return `<table class="acct-ins" style="margin-top:${mt||8}px">` + ks.map(k =>
    `<tr><td style="width:120px">${esc(k)}</td><td class="meta" style="white-space:normal">${esc(o[k])}</td></tr>`
  ).join("") + `</table>`;
}

function renderInsight(rounds, plan, ins, tour, settled, watching){
  const done = (rounds||[]).filter(r => r.posts);
  const best = Math.max(...done.map(r => r.score || 0), 1);
  const pl = (plan||[])[0];
  const S = settled||{}, W = watching||{};
  let out = "";

  // 1) 지금 무엇을 하고 있나 — 한 줄로
  if(pl){
    out += `<div class="now">
      <div class="now-h">다음 라운드 ${esc(pl.id)} · ${esc(pl.date)} <span class="tag">${esc(pl.status||"")}</span></div>
      <div class="now-q">${esc(pl["가설"] || pl.hypothesis || pl["목적"] || "")}</div>
      ${(pl["설계"] && typeof pl["설계"] === "object" && pl["설계"]["움직이는 변수"]) ? `<div class="now-v">움직이는 변수 · ${esc(pl["설계"]["움직이는 변수"])}</div>` : ""}
    </div>`;
  }

  // 2) 결론 — 확정과 관측을 나란히
  const settledKeys = Object.keys(S).filter(k => k[0] !== "_");
  const watchKeys = Object.keys(W).filter(k => k[0] !== "_");
  if(settledKeys.length || watchKeys.length){
    out += `<div class="concl">`;
    if(settledKeys.length){
      out += `<div class="card cf"><h4>확정 · 다시 실험 안 함</h4>` +
        settledKeys.map(k => `<div class="ci">
          <b>${esc(k)}</b>
          <div class="meta">${esc(S[k]["결론"] || S[k]["적용"] || "")}</div>
        </div>`).join("") + `</div>`;
    }
    if(watchKeys.length){
      out += `<div class="card cw"><h4>관측 중 · 표본 쌓는 중</h4>` +
        watchKeys.map(k => {
          const o = W[k];
          const cur = o["현재값"];
          const bar = cur ? `<div class="mini">` + Object.entries(cur).map(([kk,vv]) =>
            `<span><i style="height:${Math.max(3, Math.min(100, vv*55))}%"></i><u>${esc(kk)}</u></span>`).join("") + `</div>` : "";
          return `<div class="ci">
            <b>${esc(k)}</b> <span class="meta">${esc(o["상태"]||"")}</span>
            ${bar}
            <div class="meta">${esc(o["방침"] || o["현재해석"] || "")}</div>
            ${o["반증"] ? `<div class="warn">${esc(o["반증"])}</div>` : ""}
          </div>`;
        }).join("") + `</div>`;
    }
    out += `</div>`;
  }

  // 3) 라운드 성적 — 한 줄에 하나씩, 표처럼
  out += `<div class="card"><h4>라운드 성적</h4>
    <div class="note2">도달 = 조회수가 그 계정 평소의 몇 배. 반응 = 하트율이 평소의 몇 배. 1.0이 평소 수준.</div>
    <table class="rt"><tr><th>R</th><th>날짜</th><th>문구</th>
      <th style="text-align:right">도달</th><th style="text-align:right">반응</th><th>A / B</th><th></th></tr>` +
    done.slice().reverse().map(r => {
      const vs = Object.entries(r.variants||{});
      const vtxt = vs.length ? vs.map(([k,v]) =>
        `${k} ${v.score!=null?v.score.toFixed(2):"–"}${v.er_score!=null?"/"+v.er_score.toFixed(2):""}`).join("  ") : "";
      return `<tr>
        <td><b>${esc(r.id)}</b></td>
        <td class="meta">${esc((r.date||"").slice(5))}</td>
        <td class="rtx">${esc(r.type||"")}</td>
        <td style="text-align:right"><b>${r.score!=null?r.score.toFixed(2):"–"}</b>
          <div class="bar"><i style="width:${Math.min(100,(r.score||0)/best*100)}%"></i></div></td>
        <td style="text-align:right" class="meta">${r.er_score!=null?r.er_score.toFixed(2):"–"}</td>
        <td class="meta">${esc(vtxt)}</td>
        <td class="meta">${r.posts}건${r.sample?" · 표본"+r.sample:""}</td>
      </tr>` + (r.verdict ? `<tr class="vr"><td></td><td colspan="6">${esc(r.verdict)}</td></tr>` : "");
    }).join("") + `</table></div>`;

  // 4) 세부는 전부 접어둔다
  out += `<details class="fold"><summary>다음 라운드 상세 (배정·시각)</summary>` +
    (plan||[]).map(p2 => {
      const d = p2["설계"], jd = p2["판정"];
      const accs = p2["배정"]||p2.accounts||{};
      return `<div class="card">
        <div><span class="tag">${esc(p2.id)}</span><span class="tag">${esc(p2.date)}</span><span class="tag">${esc(p2.status||"")}</span></div>
        ${p2["목적"]?`<div style="margin:8px 0">${esc(p2["목적"])}</div>`:""}
        ${kv(d)}
        ${Object.keys(accs).length?`<div class="vs" style="margin-top:12px">`+Object.entries(accs).filter(([k])=>k!=="note").map(([k,v])=>
          `<div><b>${esc(k)}</b><div class="accs">${(Array.isArray(v)?v:[]).map(esc).join("<br>")}</div></div>`).join("")+`</div>`:""}
        ${kv(jd)}
        ${p2.note?`<div class="meta" style="margin-top:10px">${esc(p2.note)}</div>`:""}
      </div>`;
    }).join("") + `</details>`;

  out += `<details class="fold"><summary>문구 토너먼트 (챔피언·대기열·규칙)</summary>${renderTour(tour)}</details>`;
  out += `<details class="fold"><summary>시간대·요일·계정별 원자료</summary>${renderIns(ins)}</details>`;
  return out;
}

// GitHub raw에서 직접 읽는다. 로컬 파일을 보면 git pull 전까지 옛 데이터가 남는다.
const SRC = "https://raw.githubusercontent.com/ungchun/thread-images/main/dashboard.json";
// 갱신은 서버가 대신 gh를 부른다. 브라우저가 직접 하려면 토큰을 HTML에 박아야 해서 못 한다.
const btn = $("#refresh"), rmsg = $("#rmsg");
let poll = null;

function watch(){
  clearInterval(poll);
  poll = setInterval(async () => {
    try {
      const s = await (await fetch("/refresh")).json();
      if (s.running) return;
      clearInterval(poll);
      btn.disabled = false;
      if (s.error) { btn.textContent = "갱신"; rmsg.textContent = "실패: " + s.error; return; }
      rmsg.textContent = "완료, 다시 읽는 중…";
      // GitHub raw는 최대 5분 캐시라 갱신 직후엔 옛것이 올 수 있다
      setTimeout(() => location.reload(), 1500);
    } catch { clearInterval(poll); btn.disabled = false; btn.textContent = "갱신"; }
  }, 5000);
}

btn.onclick = async () => {
  btn.disabled = true; btn.textContent = "갱신 중…"; rmsg.textContent = "수집에 3분쯤 걸린다";
  try {
    const r = await (await fetch("/refresh", {method: "POST"})).json();
    if (!r.ok) { btn.disabled = false; btn.textContent = "갱신"; rmsg.textContent = r.reason; return; }
    watch();
  } catch (e) {
    btn.disabled = false; btn.textContent = "갱신";
    rmsg.textContent = "serve.py로 띄워야 갱신이 된다";
  }
};

// 새로고침 시점에 이미 갱신이 돌고 있으면 이어서 지켜본다
fetch("/refresh").then(r => r.json()).then(s => {
  if (s.running) { btn.disabled = true; btn.textContent = "갱신 중…"; watch(); }
}).catch(() => {});

// serve.py로 띄운 로컬(localhost)은 로컬 파일이 항상 최신이다 (갱신 후 pull). raw는 5분 캐시가 있어 뒤로 민다.
const LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
let SOURCE = LOCAL ? "로컬" : "github";
const first = LOCAL ? "dashboard.json?" + Date.now() : SRC + "?" + Date.now();
const second = LOCAL ? SRC + "?" + Date.now() : "dashboard.json?" + Date.now();
fetch(first, {cache: "no-store"})
  .then(r => r.ok ? r : Promise.reject(r.status))
  .catch(() => { SOURCE = LOCAL ? "github" : "로컬"; return fetch(second, {cache: "no-store"}); })
  .then(r => r.json()).then(d => {
  $("#stamp").textContent = "갱신 " + d.generated.slice(0,16).replace("T"," ") + " UTC · 최근 "
    + d.window_days + "일 · " + SOURCE;
  // 프로젝트별로 따로 본다. 계정의 project(meta.txt 3번째 토큰)로 거른다.
  const projects = d.projects || {trace: "트레이스"};
  let cur = localStorage.getItem("proj");
  if(!projects[cur]) cur = "trace" in projects ? "trace" : Object.keys(projects)[0];
  const ofProj = rows => (rows||[]).filter(r => (r.project||"trace") === cur);
  function paintProject(){
    localStorage.setItem("proj", cur);
    $("#proj").innerHTML = Object.entries(projects).map(([k,l]) =>
      `<button data-p="${k}" class="${k===cur?"on":""}">${esc(l)}</button>`).join("");
    document.querySelectorAll("#proj button").forEach(b => b.onclick = () => { cur = b.dataset.p; paintProject(); });
    const sched = ofProj(d.scheduled), posts = ofProj(d.posts), ig = ofProj(d.ig_posts),
          pending = ofProj(d.pending), skipped = ofProj(d.skipped);
    const ex = (d.experiments||{})[cur] || {rounds: d.rounds, plan: d.plan, insights: d.insights, tournament: d.tournament};
    $("#n-sched").textContent = sched.length;
    $("#n-posts").textContent = posts.length;
    $("#n-ig").textContent = ig.length;
    $("#n-pending").textContent = pending.length;
    $("#sched").innerHTML = renderSched(sched);
    $("#posts").innerHTML = renderPosts(P, posts);
    $("#ig").innerHTML = renderPosts(G, ig);
    [P, G].forEach(S => {
      S.acct = "";
      const sel = $("#" + S.id + "-acct");
      if(sel) sel.onchange = e => { S.acct = e.target.value; paintPosts(S); };
      paintPosts(S);
    });
    $("#pending").innerHTML = renderPending(pending, skipped);
    $("#insight").innerHTML = renderInsight(ex.rounds||[], ex.plan||[], ex.insights||{}, ex.tournament||{}, ex.settled||{}, ex.watching||{});
    $("#n-insight").textContent = (ex.plan||[]).length;
  }
  paintProject();
  if(d.errors && d.errors.length)
    $("#errors").innerHTML = `<div class="err">수집 실패 ${d.errors.length}건: ${esc(d.errors.join(" / "))}</div>`;

  const tip = $("#tip");
  document.addEventListener("mouseover", e => {
    const t = e.target.closest("[data-tip]");
    if(!t) return tip.style.display = "none";
    tip.textContent = t.dataset.tip; tip.style.display = "block";
    const r = t.getBoundingClientRect();
    tip.style.left = Math.min(r.left, innerWidth - 360) + "px";
    tip.style.top = (r.bottom + 8) + "px";
  });
}).catch(e => {
  $("#errors").innerHTML = `<div class="err">데이터를 못 읽었다. 워크플로를 한 번 돌려야 한다.<br>${esc(e.message)}</div>`;
});
</script>
